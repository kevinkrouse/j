toggleSidebar=Toggles the sidebar.
toggleWrap=Toggles automatic word wrap in the current buffer.
top=Moves the caret to the top line of the display, keeping it in the same column.
uncommentRegion=Uncomments the selected lines, or the current line.
undo=Undoes the last editing action or actions.
unfold=Unfolds the current fold.
unfoldAll=Unfolds all the folds in the current buffer.
unfoldHere=Unfolds the fold just below the caret's line, and only that one.
unsplitAllWindows=Closes all windows except for the current edit window.
unsplitWindow=Closes the window(s) on the opposite side of the split from the current window.
unwrapParagraph=Removes line breaks from the current paragraph, making it into one lone line.
up=Moves the caret up one line.
upperCaseRegion=Converts all upper case characters in the selected region to lower case.
vcsBranchCheckout=Checks out a branch, tag or revision, from a list or typed.
vcsBranchCheckoutLocal=Checks out a local branch, from a list.
vcsBranchCheckoutNew=Creates a branch and checks it out.
vcsBranchCheckoutRecent=Checks out a branch checked out before, latest first, as the reflog has them.
vcsBranchCreate=Creates a branch without checking it out.
vcsBranchDelete=Deletes a local branch, from a list, after asking.
vcsBranchPopup=Opens the branch popup, after Neogit's.
vcsBranchRename=Renames a local branch, from a list.
vcsBranchSetParent=Sets the parent of the branch checked out, from a list.
vcsCommandLog=Shows the version control commands j has run, newest last.
vcsCommit=In a status buffer, opens a message to commit what is staged with, in a window beside it.
vcsCommitAbort=Gives up the commit message being written without asking; it goes to the comment ring.
vcsCommitAmend=In a status buffer, replaces the last commit, with what is staged.
vcsCommitCancel=Gives up the commit message being written, asking first.
vcsCommitExtend=In a status buffer, adds what is staged to the last commit, keeping its message.
vcsCommitFinish=Commits with the message being written, its # lines left out.
vcsCommitNextMessage=In a commit message, steps forward through the messages committed or given up before.
vcsCommitPopup=Opens the commit popup: its switches, and commit, amend, extend and reword.
vcsCommitPreviousMessage=In a commit message, steps back through the messages committed or given up before.
vcsCommitReword=In a status buffer, opens the last commit's message, to change only its message.
vcsDiff=Compares the file with what is staged of it, side by side.
vcsDiscard=In a status buffer or its diff, discards the thing at the caret, after asking.
vcsFetchAll=In a status buffer, fetches from every remote.
vcsFetchBranch=In a status buffer, fetches only a remote's branch, picked from a list.
vcsFetchElsewhere=In a status buffer, fetches from a remote picked, or a URL or path typed.
vcsFetchPopup=Opens the fetch popup: its switches, and the remotes to fetch from.
vcsFetchPushRemote=In a status buffer, fetches from the push remote: the remote of where the branch pushes.
vcsFetchUpstream=In a status buffer, fetches from the remote of the branch's upstream.
vcsLog=Shows the repository's log, every branch and tag, newest first.
vcsLogClearFilters=In the log, clears every filter, a file's log's path too, and reads the log again.
vcsLogCollapseRuns=In the log, folds each run of plain commits, or shows every commit again.
vcsLogDiffView=In the full log, switches the diff between unified and side by side.
vcsLogFile=Shows the log of the current file, through its renames, taking the whole frame.
vcsLogFilter=In the log, edits a filter's value in the filter bar.
vcsLogNext=In the log, goes to the next commit, file or hunk.
vcsLogNextFile=In the log, shows the next file's diff, the focus staying where it is.
vcsLogOpenFile=In the log's files or diff, opens the file at the caret in the working tree.
vcsLogPopup=In a status buffer, opens a popup of the logs.
vcsLogPrevious=In the log, goes to the previous commit, file or hunk.
vcsLogPreviousFile=In the log, shows the previous file's diff, the focus staying where it is.
vcsLogQuick=Shows the repository's log alone, in a window under the current one.
vcsLogQuit=Closes the log: the windows from before it come back, or the quick log's window goes.
vcsLogRefresh=Reads the log again, the caret staying on its commit.
vcsLogRefsOrder=In the log, orders the refs tree's branches by name or by newest commit.
vcsLogRevision=In the log's files or diff, opens the file as the commit has it.
vcsLogScrollDiff=In the log, scrolls the diff a page on, from any pane.
vcsLogScrollDiffBack=In the log, scrolls the diff a page back, from any pane.
vcsLogTimeStyle=In the log, steps the date style.
vcsLogToggle=In the log, opens or closes the hunk or run of commits at the caret.
vcsLogToggleAll=In the log, closes every hunk or run of commits, or opens them all.
vcsLogToggleStashes=In the log, shows or hides the stashes.
vcsLogToggleTags=In the log, shows or hides the commits only tags reach.
vcsLogVisit=In the log, goes into the thing at the caret.
vcsMerge=Merges a branch, tag or revision into what is checked out.
vcsMergeAbort=Gives up the merge in progress, after asking, putting back what was there before it.
vcsMergeCommit=Commits the merge in progress, with git's message.
vcsMergePopup=Opens the merge popup, after Neogit's.
vcsStage=In a status buffer or its diff, stages the thing at the caret.
vcsStageAll=In a status buffer, stages every change to a tracked file.
vcsStageHunk=Stages the change at the caret, or the selected lines.
vcsStashApply=In a status buffer, applies the stash at the caret, or the newest, keeping it.
vcsStashDrop=In a status buffer, drops the stash at the caret, or the newest, after asking.
vcsStashKeepIndex=In a status buffer, stashes the changes, keeping what is staged in the index too.
vcsStashPop=In a status buffer, applies a stash, then drops it if it applied cleanly.
vcsStashPopup=Opens the stash popup: the ways to stash, and applying, popping and dropping.
vcsStashSave=In a status buffer, stashes the changes, staged and not.
vcsStashStaged=In a status buffer, stashes what is staged alone, leaving the rest.
vcsStashUntracked=In a status buffer, stashes the changes and the untracked files, which are removed.
vcsStatus=Opens the status of the buffer's repository: changes, staging and recent commits.
vcsStatusCycle=In a status buffer, opens everything one depth further.
vcsStatusDepth=In a status buffer, opens everything to a depth, 1 to 4.
vcsStatusDiff=In a status buffer, shows or closes the diff of the file at the caret.
vcsStatusDiffView=In a status buffer, switches its diff between unified and side by side.
vcsStatusNext=In a status buffer, goes to the next section, file, hunk or commit.
vcsStatusNextSection=In a status buffer, goes to the next section.
vcsStatusPrevious=In a status buffer, goes to the previous section, file, hunk or commit.
vcsStatusPreviousSection=In a status buffer, goes to the previous section.
vcsStatusRefresh=Reads a status buffer's repositories again, for a change j could not see.
vcsStatusScrollDiff=In a status buffer, scrolls the diff beside it down a page, from the status or the diff.
vcsStatusScrollDiffBack=In a status buffer, scrolls the diff beside it up a page, from the status or the diff.
vcsStatusToggle=In a status buffer, opens or closes the section, file or hunk at the caret.
vcsStatusVisit=In a status buffer, visits the file, commit or stash at the caret.
vcsUnstage=In a status buffer or its diff, unstages the thing at the caret.
vcsUnstageAll=In a status buffer, unstages everything.
vcsUnstageHunk=Unstages the change at the caret, or under the selection.
vimQuitDiscard=In vim edit mode, runs :q!, which a buffer's mode may take as its own.
vimWriteQuit=In vim edit mode, runs :x: writes the buffer if changed, and closes the window.
visibleTabs=Toggles the visibility of tab characters in the buffer.
vsplitWindow=Splits the current window vertically and moves focus to the new window.
whatChar=Shows the decimal, hex and character of the character at the caret.
whereIs=Displays information about the keys mapped to a particular command.
windowDown=Scrolls the text up one line, without moving the caret.
windowUp=Scrolls the text down one line, without moving the caret.
wordLeft=Moves the caret to the start of this word, or of the previous one.
wordRight=Moves the caret to the beginning of the next word.
wrapComment=Wraps the comment's lines at the wrap column, by default 80.
wrapParagraph=Wraps the paragraph at the wrap column, by default 80.
wrapParagraphsInRegion=Wraps every paragraph in the selection, or in the buffer.
wrapRegion=Wraps the selected lines at the wrap column, by default 80.
writeGlobalKeyMap=Writes the global key map to a file, readably.
writeLocalKeyMap=Writes the buffer's local key map to a file, readably.
xmlElectricEquals=Inserts '=' at the current location of the caret.
xmlElectricSlash=Inserts '/' at the current location of the caret.
xmlFindCurrentNode=In XML mode, expands the sidebar's tree to the caret's node.
xmlFindMatch=An alias for findMatchingPair.
xmlFormatAttributes=Lays out the attributes of the start tag at the caret, or the selected lines'.
xmlInsertEmptyElementTag=Inserts an XML empty element tag.
xmlInsertMatchingEndTag=Inserts the end tag of the unmatched start tag before the caret.
xmlInsertTag=Inserts an XML start tag and the corresponding end tag, enclosing the current selection.
xmlParseBuffer=In XML mode, parses the current buffer.
xmlValidateBuffer=In XML mode, validates the current buffer.
