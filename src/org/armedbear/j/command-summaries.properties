# Generated by `bb command-summaries` from doc/commands.html; do not edit.
about=Displays the about box.
adjacentWindow=Moves to the window beside this one: h left, j below, k above or l right.
alias=Sets or modifies an alias.
alignStrings=Prompts for a regular expression and aligns the first occurrence of the specified regular expression in each line of the selected region.
apropos=Displays a list of commands and preferences that contain a specified pattern.
archiveOpenFile=Opens the file at the location of the caret or mouse click.
attachFile=Attaches a file to the message in the current mail composition buffer.
backspace=If a region is marked, deletes it.
backwardParagraph=Moves the caret to the empty line after (or before) the paragraph, passing over a run of empty lines first.
backwardSection=Moves the caret to the next (or previous) line with a { in its first column, or with the argument }, as in forwardSection }, a }.
backwardSentence=Moves the caret to the start of the next sentence (or of this one, or the one before).
backwardSexp=Moves backward across one balanced syntactic expression, if possible.
backwardUpList=Moves the caret backward out of one level of parentheses.
balanceWindows=Makes the windows in each row and column the same size again, however their dividers have been dragged.
binaryMode=Reloads the current buffer in binary mode.
bob=Moves to the beginning of the buffer.
bol=Moves the caret to the beginning of the line.
bottom=Moves the caret to the bottom line of the display, keeping it in the same column.
bounceMessage=Resends the current message to one or more specified addresses.
browseFileAtDot=Uses the default browser to view the file at the location of the caret.
ccGroup=This command is available in mail composition buffers when you're replying to a message.
centerTag=Centers the current function vertically in the edit window.
changes=Runs diff to show the unsaved changes to the current buffer (if any).
checkPath=Examines all the lines in the current buffer that start with "#include" and reports which included files can't be found in your include path (or in the current directory, if the filename is enclosed in quotes rather than in angle brackets).
clearRegister=Prompts for a register name and erases the contents of the specified register.
clearSearchHighlight=Stops highlighting the matches of the last search until the next search, or until findNext or findPrev shows them again.
closeAll=Closes all open buffers, leaving a directory buffer looking at the current directory.
closeOthers=Closes all open buffers except the current one.
closeParen=Inserts a closing parenthesis and briefly moves the caret to the matching opening parenthesis.
commentRegion=Comments out each line in the selected region, or the current line if no region is selected.
compile=Compiles the source file in the current buffer.
compose=Opens a new mail composition buffer.
copyAppend=Appends the selected region (or the current line if no region is selected) to last entry in the kill ring.
copyLink=In web mode, copies to the kill ring (and to the system clipboard) the link at the location of the caret.
copyPath=In directory buffers, copies to the kill ring (and to the system clipboard) the full pathname of the file on the line containing the caret.
copyRegion=Copies the contents of the selected region (or the current line if no region is selected).
copyXPath=In XML mode, copies to the kill ring (and to the system clipboard) the path of the element at the current location of the caret.
cppFindMatch=If the caret is on a line that starts with #if, #else, #elif or #endif, finds the matching expression.
cvs=Executes an arbitrary CVS command.
cvsAdd=Adds the file associated with the current buffer to CVS.
cvsCommit=Opens a checkin buffer in which you can compose a CVS checkin comment for the file associated with the current buffer.
cvsDiff=Opens a diff output buffer showing the changes between the checked-in version of the file associated with the current buffer and your local copy.
cvsDiffDir=Opens a diff output buffer showing the changes between the checked-in version and your local copy for all the files in the current directory and its subdirectories.
cvsLog=Runs the CVS "log" command on the file associated with the current buffer.
cycleIndentSize=Cycles through the most plausible possibilities for the indent size of the current buffer (2, 4 and 8 spaces).
cyclePaste=If the last command to be executed was not paste or cyclePaste, cyclePaste does exactly the same thing as paste.
cycleTabWidth=Cycles through the most plausible possibilities for the tab width of the current buffer (2, 4 and 8 spaces).
darcs=Executes an arbitrary darcs command.
decodeRegion=Base 64 decodes the selected region (or the line containing the caret if no region is selected).
decrementNumber=Adds the command's argument, or 1, to the number at or after the caret on its line, or takes it away: decimal, with a leading minus, 0x hexadecimal and 0b binary.
defaultKeyMaps=Discards all custom key mappings and returns to j's internal defaults.
defaultMode=Reloads the current buffer in its default mode.
delete=If a region is marked, deletes it.
deleteWordLeft=Deletes the word to the left of the caret.
deleteWordRight=Deletes the word to the right of the caret.
describe=In a Lisp shell, runs 'cl:describe' on the symbol under the caret.
describeBindings=Displays a list of the key bindings that are in effect in the current buffer.
describeKey=Displays information about the command mapped to a particular key or key combination.
detabRegion=Replaces tab characters in the selected region with the appropriate number of spaces, based on the tab width of the buffer.
diff=Runs diff with the supplied arguments and presents the output in a diff output buffer.
diffGotoFile=Jumps to the location in the source buffer corresponding to the current line in the diff output buffer.
dir=Opens a directory buffer on the current directory.
dirBack=Changes to the previous directory in the history list for the current directory buffer.
dirBrowseFile=Uses the default browser to view the file at the location of the caret.
dirCopyFile=Copies the file at the current location of the caret to a specified destination.
dirCycleSortBy=Cycles through the possibilities (name, date, size) for the sort order of the directory listing.
dirDeleteFiles=Deletes the marked files, or, if no files are marked, deletes the file at the current location of the caret.
dirDoShellCommand=Prompts for a shell command and executes the specified command on all the marked files in the current directory buffer.
dirForward=Changes to the next directory in the history list for the current directory buffer.
dirGetFile=Copies the remote file at the current location of the caret to a specified destination on the local machine.
dirHome=If the caret is to the right of the first character of the filename on the current line, moves the caret to the first character of the filename.
dirHomeDir=If the current buffer is a directory buffer, changes to the home directory of the current user.
dirLimit=Sets a limit pattern (something like "*.java") to control what files are displayed in the directory listing.
dirMoveFile=Moves the file at the current location of the caret to a specified destination.
dirOpenFile=Opens the file or directory at the location of the caret or mouse click in a directory buffer.
dirOpenFileAndKillDirectory=Opens the file or directory at the location of the caret or mouse click in a directory buffer and then closes the directory buffer.
dirProjectDir=Shows the current buffer's project root in a directory buffer: the current buffer, if it is one, or else one for the root.
dirRescan=Refreshes the directory listing for the current directory buffer and rescans the directory tree.
dirTagFile=Tags or untags the file at the current location of the caret.
dirUnlimit=Removes any limit pattern that may be in effect for the current directory buffer, so that all files are displayed.
dirUpDir=Navigates to the parent of the current directory.
doShellCommandOnRegion=Prompts for a shell command and then executes that command, using the selected region as input.
down=Moves the caret down one line.
downList=Moves forward down one level of parentheses.
dropBookmark=Drops a numbered bookmark at the location of the caret in the current buffer.
dropTemporaryMarker=Drops a temporary marker at the location of the caret in the current buffer.
duplicateLines=Copies the current line, or every line the selection covers, immediately below itself.
editPrefs=Opens the preferences file for editing.
editRegister=Prompts for a register name and opens a buffer so you can edit the contents of the specified register.
electricCloseAngleBracket=Inserts '>' and, if the property autoIndent is true, re-indents the current line according to context.
electricCloseBrace=Inserts '}' and re-indents the current line according to context.
electricCloseParen=Inserts ')' and evaluates the sexp in the lisp shell if complete.
electricColon=Inserts a colon at the current location of the caret and re-indents the current line according to context.
electricOpenBrace=Inserts '{' and re-indents the current line according to context.
electricPound=Inserts a '#' character at the current location of the caret.
electricQuote=Inserts a pair of '"' characters at the current location of the caret and places the caret between them.
electricSemi=Inserts a semicolon at the current location of the caret and re-indents the current line according to context.
electricStar=Inserts '*' at the current location of the caret and, if the current line is otherwise blank, re-indents the line according to context.
end=Moves the caret to the end of the current line.
endMacro=Stop recording keystrokes.
enlargeWindow=Grows the current split window by a line.
entabRegion=Replaces spaces with tab characters in the selected region, based on the tab width of the buffer.
eob=Moves the caret to the end of the buffer.
eol=Moves the caret to the end of the line.
escape=Escapes from the last operation.
evalDefunLisp=Sends the definition at the location of the caret in a Lisp source buffer to the active Lisp shell for evaluation.
evalRegionLisp=Sends the selected region in a Lisp source buffer to the active Lisp shell for evaluation.
executeCommand=Executes an editor command by name.
expand=Replaces the text to the left of the caret with a word in the current buffer for which that text is a prefix.
find=Prompts for a pattern and finds the next occurrence of the specified pattern in the current buffer.
findAction=Finds a command by its name or description, and runs it.
findBookmark=Lists the bookmarks, 0 to 9 and A to Z, each with its file, line and text, and goes to the one you pick.
findCharInLine=Moves the caret to the next (or previous) occurrence of a character on the current line.
findCharInLineBackward=Moves the caret to the next (or previous) occurrence of a character on the current line.
findFileInProject=Finds a file in the current buffer's project, its open buffers or its recent files, matching the characters you type in order but not necessarily together: ofth finds OpenFileTextFieldHandler.java.
findFirstOccurrence=Finds the first occurrence in the current buffer of the word at the current location of the caret.
findInFiles=Prompts for a pattern and a file specification and generates a list of all occurrences of the specified pattern in files matching the file specification.
findMatchingChar=Finds the match of the brace, parenthesis or bracket at the location of the caret.
findNext=Finds the next match in the current search (initiated by find, incrementalFind, findNextWord or findPrevWord).
findNextWord=Finds the next occurrence in the current buffer of the word at the current location of the caret.
findOccurrenceAtDot=Jumps to the source line that corresponds to the current line in a List Occurrences buffer.
findOccurrenceAtDotAndKillList=Jumps to the source line that corresponds to the current line in a List Occurrences buffer, and closes the List Occurrences buffer.
findPrev=Finds the previous match in the current search (initiated by find, incrementalFind, findNextWord or findPrevWord).
findPrevWord=Finds the previous occurrence in the current buffer of the word at the current location of the caret.
findTag=Prompts for a tag (generally speaking, a tag is a function name) and moves the caret to the definition of the specified function.
findTagAtDot=Jumps to the definition of the function at the current location of the caret.
findTagAtDotOtherWindow=Jumps to the definition of the function at the current location of the caret, using the other window (splitting the current window if necessary).
findUnmatchedBracket=Moves the caret to the bracket that is still open where the caret is: with the argument (, [ or { back to the one that opens it, with ), ] or } on to the one that closes it, as in findUnmatchedBracket (.
finish=Completes the version control checkin operation, using the contents of the current buffer as the checkin comment.
fold=Creates a fold at (or near) the current location of the caret.
foldAll=Folds everything the mode can, leaving an outline: the methods, as foldMethods does in Java and Perl modes, or in Markdown mode, the headings, as foldHeadings does.
foldMethods=Folds all the methods in the current buffer.
foldRegion=Folds the marked region.
followLink=Goes where the link at the caret points.
followLinkOrTask=In Markdown mode, followLink if the caret is on a link, saying so if its reference is not defined; else task on a list item or a selection.
forwardParagraph=Moves the caret to the empty line after (or before) the paragraph, passing over a run of empty lines first.
forwardSection=Moves the caret to the next (or previous) line with a { in its first column, or with the argument }, as in forwardSection }, a }.
forwardSentence=Moves the caret to the start of the next sentence (or of this one, or the one before).
forwardSexp=Moves forward across one balanced syntactic expression, if possible.
git=Executes an arbitrary git command.
gotoBookmark=Returns to a previously dropped numbered bookmark.
gotoFile=Opens the file at the location of the caret or mouse click.
gotoTemporaryMarker=Returns to a previously dropped temporary marker.
gotoWindow=Moves to the window with the number given, counting from the top left.
help=Finds a help topic: a page of this manual, a command or a preference, by matching what you type as findFileInProject does, and displays it.
home=Moves the caret to the beginning of the text on the current line, if the caret is to the right of that location to begin with.
htmlBold=Inserts an HTML bold tag ("<B>") before the selected text (or before the location of the caret, if there's no selection) and an HTML end tag ("</B>") after the selected text (or after the location of the caret).
htmlElectricEquals=Inserts '=' at the current location of the caret.
htmlEndTag=Inserts an empty HTML end tag, with the caret positioned after the opening "</".
htmlFindMatch=Finds the match to the HTML tag at the location of the caret.
htmlInsertMatchingEndTag=Inserts the HTML end tag corresponding to the last HTML start tag before the location of the caret.
htmlInsertTag=Inserts an HTML start tag and (if appropriate) the corresponding end tag, enclosing the current selection.
htmlStartTag=Inserts an empty HTML start tag, with the caret positioned after the opening angle bracket.
httpShowHeaders=Displays the request and response headers for the current HTTP buffer.
hyperspec=Displays the Common Lisp HyperSpec documentation for the symbol at the current location of the caret.
iList=Lists all occurrences of the identifier at the location of the caret, both in the current buffer and in any files referenced by a "#include" directive in the current buffer, in the order in which they occur.
imageCycleBackground=In Image mode, changes the background color of the image.
imageFit=Scales the image to fit the current display window.
imageRestore=Restores the image to its original size.
imageZoomIn=Zoom in by a factor of 2.
imageZoomOut=Zoom out by a factor of 2.
inbox=Opens your default inbox.
incrementNumber=Adds the command's argument, or 1, to the number at or after the caret on its line, or takes it away: decimal, with a leading minus, 0x hexadecimal and 0b binary.
incrementalFind=Prompts for input and finds the string entered, as it is typed in.
indentLine=Applies j's idea of correct indentation to the current line.
indentLineOrRegion=Applies j's idea of correct indentation to the marked region, or, if no region is marked, the current line.
indentRegion=Applies j's idea of correct indentation to the marked region.
insertBraces=Inserts an opening brace followed by a closing brace, indented appropriately, leaving the caret positioned between them.
insertByte=Inserts the character that corresponds to the specified byte in the default encoding at the current location of the caret.
insertChar=Inserts the specified Unicode character at the current location of the caret.
insertKeyText=Inserts the next key combination you type (which can be a single key like Enter or Backspace, or a combination like Ctrl Alt S) as a string (like "Enter" or "Backspace" or "Ctrl Alt S") at the location of the caret in the current buffer.
insertParentheses=If a region is selected, inserts parentheses around the selected region.
insertRegister=Lists the registers, each with the first line it holds, and inserts the contents of the one you pick at the location of the caret in the current buffer.
insertString=Requires a string argument.
insertTab=If useTabs is true for the current buffer, inserts a tab character at the location of the caret, otherwise inserts the appropriate number of spaces, based on the buffer's indentSize.
jdb=Invokes j's built-in Java debugger, or, if the debugger is already running, ensures that the debugger transcript buffer is visible.
jdkHelp=Displays the JDK HTML help file corresponding to the class name at the location of the caret or mouse click.
jlisp=Runs Armed Bear Lisp embedded in the running instance of j, with interaction in a Lisp shell buffer.
joinLines=Joins the next line onto the current one, putting a single space at the join and dropping the indent of the line pulled up.
jumpBack=Back along the jump list to where the caret was before the last jump, or forward again.
jumpForward=Back along the jump list to where the caret was before the last jump, or forward again.
jumpToColumn=Prompts for a column number and moves the caret to the specified column.
jumpToLine=Prompts for a line number and moves the caret to the beginning of the specified line.
jumpToOffset=Prompts for an absolute offset (the number of characters from the start of the buffer) and moves the caret to the specified location.
justOneSpace=Replaces all whitespace under the caret, including newlines, with a single space character.
killAppend=Deletes the selected region (or the current line if no region is selected), appending the deleted text to the most recent entry in the kill ring.
killBuffer=Closes the current buffer and removes it from the buffer list.
killFrame=Closes the current frame.
killLine=Copies the text from the location of the caret to the end of the current line to the kill ring and then deletes that text.
killRegion=Deletes the selected region (or the current line if no region is selected).
killWindow=If the current frame contains a split window, closes the current edit window, and gives focus to the other edit window.
killWordLeft=Deletes the word to the left of the caret, appending the deleted text to the kill ring.
killWordRight=Deletes the word to the right of the caret, appending the deleted text to the kill ring.
left=Moves the caret one character to the left.
lisp=Runs Lisp as a separate process, with interaction in a Lisp shell buffer.
lispFindMatchingChar=Finds the match of the parenthesis at the location of the caret.
lispSelectSyntax=Selects the syntactic expression in the vicinity of the caret.
listBindings=Deprecated: Use describeBindings instead.
listFiles=Displays the List Occurrences output buffer generated by the last invocation of findInFiles.
listIncludes=Recursively lists all files referenced by a "#include" directive in the current buffer or in a file so referenced.
listOccurrences=Lists all lines in the current buffer that match the last search.
listOccurrencesOfPatternAtDot=Lists all occurrences in the current buffer of the selected text (if any) or of the word at the current location of the caret.
listRegisters=Lists the contents of all registers in use.
listStyles=Lists every style the theme gives: the built-in ones every mode has (text, background, caret, selection, comment, keyword and so on), the shared styles, and the current buffer's mode's, each drawn in itself with a swatch of its color in the gutter, in columns: its color and style, the names it links to (→ heading), and where its color and its style came from.
listTags=Lists the tags in the current buffer (generally speaking, a tag is a function name).
loadSession=Loads a previously saved named session.
lowerCaseRegion=Converts all upper case characters in the selected region to lower case.
mailboxDelete=Marks for deletion the tagged messages or the message at the current location of the caret.
mailboxExpunge=Commits deletions in the current mailbox.
mailboxFlag=Toggles the "important" flag of the current message (or set of tagged messages).
mailboxGetNewMessages=Connects to the server and retrieves any new messages (POP) or message headers (IMAP).
mailboxLastMessage=Moves to the last message in the mailbox.
mailboxLimit=Prompts for a pattern and limits the messages displayed in the mailbox to those matching the specified pattern.
mailboxMarkRead=Marks the current message (or set of tagged messages) read.
mailboxMarkUnread=Marks the current message (or set of tagged messages) unread.
mailboxMoveToFolder=Moves the current message (or set of tagged messages) to the specified folder.
mailboxReadMessage=Opens a message buffer to read the message at the current location of the caret.
mailboxSaveToFolder=Saves the current message (or set of tagged messages) in the specified folder.
mailboxStop=Stops the current background process in a mailbox buffer.
mailboxTag=Tags or untags the message at the current location of the caret.
mailboxTagPattern=Prompts for a pattern and tags all messages that match the specified pattern.
mailboxToggleRaw=Toggles raw mode for messages in this mailbox.
mailboxUndelete=Undeletes the tagged messages or the message at the current location of the caret.
mailboxUnlimit=Cancels the limit pattern for the current mailbox, so all messages are listed.
mailboxUntagAll=Untags all messages in the current mailbox.
makeTagFile=Makes a tag file for the current directory.
man=Prompts for a topic and displays the corresponding man page.
manFollowLink=Invokes man on the cross reference at the location of the caret or mouse click.
markSexp=Marks the region from the caret position to the end of the containing sexp.
messageDelete=Marks the current message deleted and loads the next undeleted message in the current message buffer.
messageFlag=Toggles the "important" flag of the current message and loads the next undeleted message in the current message buffer.
messageForward=Opens a mail composition buffer to forward the current message.
messageIndex=Closes the current message buffer and returns to the parent mailbox.
messageMoveToFolder=Moves the current message to the specified folder.
messageNext=Loads the next undeleted message in the current message buffer.
messageNextInThread=Loads the next message in the current thread into the current message buffer.
messagePrevious=Loads the previous undeleted message in the current message buffer.
messagePreviousInThread=Loads the previous message in the current thread into the current message buffer.
messageReplyToGroup=Opens a mail composition buffer to reply to the current message.
messageReplyToSender=Opens a mail composition buffer to reply to the current message.
messageSaveAttachment=Prompts for a filename and saves the attachment listed on the line containing the caret to the specified file.
messageToggleHeaders=Toggles display of full headers in message buffers.
messageToggleRaw=Toggles raw mode for the current message (and all messages in the parent mailbox).
messageToggleWrap=Toggles word wrap for the current message.
messageViewAttachment=Opens the attachment listed on the line containing the caret.
mode=Changes the mode of the current buffer.
mouseCopyToInput=Copies the current selection or the current sexp to the input line.
mouseFindOccurrence=Jumps to the line in the source file corresponding to the location of the mouse click in a List Occurrences buffer.
mouseFindTag=Jumps to the definition of the function at the location of the mouse click.
mouseMoveDotToPoint=Moves the caret to the location of the mouse click.
mousePaste=If a selection is marked, the contents of the selected region are copied to the kill ring, and the region is deselected.
mouseSelect=Selects the region from the caret to the location of the mouse click, or adjusts the current selection accordingly.
mouseShowContextMenu=Displays the context menu (if any) for the current buffer.
moveLinesDown=Moves the current line, or every line the selection covers, up or down by one.
moveLinesUp=Moves the current line, or every line the selection covers, up or down by one.
movePastCloseAndReindent=Moves the caret past the next unmatched closing parenthesis to the right of its current location, inserts a line separator, and indents according to context.
moveToWindowBottom=Moves the caret to the first non-blank of the top, middle or bottom line the window is showing, without scrolling.
moveToWindowMiddle=Moves the caret to the first non-blank of the top, middle or bottom line the window is showing, without scrolling.
moveToWindowTop=Moves the caret to the first non-blank of the top, middle or bottom line the window is showing, without scrolling.
newBuffer=Creates and activates an empty buffer with no associated file.
newFrame=Creates a new frame (top-level editor window) displaying the current buffer.
newline=Inserts a line separator at the location of the caret.
newlineAndIndent=Inserts a line separator at the location of the caret and indents according to context.
nextBuffer=Switches to the next buffer.
nextChange=Moves to the next group of changed lines (below the position of the caret in the current buffer).
nextComment=Cycles forwards through the history of version control checkin comments.
nextError=Jumps to the location in the source file that corresponds to the next compilation error.
nextFrame=Activates the next frame (top-level editor window).
nextWindow=Selects the next window in the current frame.
offset=Reports the current location of the caret as an absolute offset (the number of characters from the start of the buffer).
openFile=Sets focus to the edit control in the location bar of the current window, where you can find a file and press Enter to open it.
openFileInOtherFrame=Same as openFile, but the specified file is opened in a different (possibly new) frame (top-level editor window).
openFileInOtherWindow=Same as openFile, but the specified file is opened in the other window of the current frame.
openFileInSplit=Splits the window, top and bottom or side by side, and opens the file named by the command's argument in the top or left one, with the caret, as in openFileInSplit README.
openFileInVsplit=Splits the window, top and bottom or side by side, and opens the file named by the command's argument in the top or left one, with the caret, as in openFileInSplit README.
openMailbox=Prompts for a URL and opens the corresponding mailbox.
otherWindow=Go to the paired window or parent window for the current editor.
p4=Executes an arbitrary Perforce command.
p4Add=Runs the Perforce "add" command on the file associated with the current buffer.
p4Change=Runs the Perforce "change" command.
p4Diff=Opens a diff output buffer showing the changes between your local copy of the file associated with the current buffer and the version in the Perforce repository.
p4DiffDir=Opens a diff output buffer showing the changes between the checked-in version and your local copy for all files that are open in Perforce.
p4Edit=Runs the Perforce "edit" command on the file associated with the current buffer.
p4Log=Runs the Perforce command "filelog -l" on the file associated with the current buffer.
p4Revert=Runs the Perforce "revert" command on the file associated with the current buffer.
p4Submit=Opens a checkin buffer in which you can compose a Perforce checkin comment for the default changelist (or you can use the "-c" option to specify a different numbered changelist).
pageDown=Moves the caret down one full screen.
pageDownOtherWindow=Moves the caret down one full screen in the other window in the same frame.
pageUp=Moves the caret up one full screen.
pageUpOtherWindow=Moves the caret up one full screen in the other window in the same frame.
paste=The contents of the system clipboard (if any) are appended to the kill ring, and then the last item from the kill ring (which will be the contents of the system clipboard, if anything was there) is inserted at the current location of the caret.
pasteColumn=Inserts the last killed or copied column at the current location of the caret.
pastePrimarySelection=Inserts the primary X selection at the current location of the caret or mouse click.
playbackMacro=Plays back previously recorded keystrokes.
popPosition=Goes back to where the caret was before the last jump, as jumpBack does: the position stays on the jump list, so jumpForward comes back.
prevBuffer=Switches to the previous buffer.
previousChange=Moves to the previous group of changed lines (above the position of the caret in the current buffer).
previousComment=Cycles backwards through the history of version control checkin comments.
previousError=Jumps to the location in the source file that corresponds to the previous compilation error.
previousWindow=Selects the previous window in the current frame.
print=Prints the selected region, or the current buffer if no region is selected.
priorWindow=Selects the previously focused window in the current frame.
properties=Invokes the Properties dialog, which lets you inspect and modify buffer-specific settings such as tab width, indent size, and mode.
pushPosition=Puts the location of the caret on the jump list, for popPosition or jumpBack to come back to.
quit=Shuts down the editor.
recentFiles=Finds a file you've visited recently, by matching what you type as findFileInProject does; with nothing typed, the most recent come first.
recompile=Compiles the source file in the current buffer, using the last specified compile command.
recordMacro=Records keystrokes for later playback.
redo=Undoes the last undo.
reloadKeyMaps=Reloads all configured key maps.
renumberRegion=Changes the first number in each line of the selected region so that the it is one more than the first number in the preceding line.
replace=Replaces one or more occurrences of one pattern with another.
replaceChar=Puts the command's argument in place of the character under the caret, without inserting.
replaceInFiles=Replaces one or more occurrences of one pattern with another in multiple files.
rescanProject=Lists the current project's files again, for findFileInProject.
resetDisplay=Resets and repaints all edit windows.
resetLisp=Resets the current Lisp shell so that it returns to the outermost read-eval- print loop.
revertBuffer=Reloads the current buffer.
right=Moves the caret one character to the right.
save=Saves the current buffer, if it has been modified.
saveAll=Saves all modified buffers.
saveAllExit=Saves all modified buffers and shuts down the editor.
saveAs=Given a file name as its argument, as in saveAs notes.txt, it saves there without the dialog; a relative name is taken from the buffer's directory.
saveCopy=Given a file name as its argument it writes the copy there without the dialog.
saveSession=Saves information about the current editing session in the active named session file.
saveToRegister=Prompts for a register name and saves the selected region in the specified register.
selectAll=Selects the entire buffer.
selectBob=Extends the selection to the beginning of the buffer.
selectDown=Extends the selection down one line.
selectEnd=Extends the selection to the end of the current line.
selectEob=Extends the selection to the end of the buffer.
selectHome=Extends the selection to the beginning of the current line.
selectLeft=Extends the selection one character to the left.
selectPageDown=Extends the selection down one full screen.
selectPageUp=Extends the selection up one full screen.
selectRight=Extends the selection one character to the right.
selectSyntax=Selects the syntactic expression in the vicinity of the caret.
selectToMarker=Selects the region from the current location of the caret to the specified marker (bookmark).
selectToTemporaryMarker=Selects the region from the current location of the caret to the temporary marker.
selectUp=Extends the selection up one line.
selectWord=Selects the word at the location of the caret or mouse click.
selectWordLeft=Extends the selection to the left by one word.
selectWordRight=Extends the selection to the right by one word.
send=In a mail composition buffer, sends the current message.
sendMailBackTab=Goes back to the previous field in the header area of a mail composition buffer.
sendMailTab=Advances to the next field in the header area of a mail composition buffer.
setEncoding=Sets the character encoding to be used when the current buffer is saved.
shellCommand=Prompts for a shell command and then executes that command using /bin/sh.
shellEscape=In a shell buffer, if a selection is marked, clears it.
shellHome=In a shell buffer, if the current line begins with a prompt, and if the caret is to the right of the prompt, moves the caret to the end of prompt.
shellNextInput=Retrieves the next command from input history in a shell buffer.
shellNextPrompt=Moves the caret to the next prompt in a shell buffer.
shellPreviousInput=Retrieves the previous command from input history in a shell buffer.
shellPreviousPrompt=Moves the caret to the previous prompt in a shell buffer.
shellTab=Completes pending input.
shiftLinesLeft=Moves the indent of the current line, or of every line the selection covers, right or left by one indentSize.
shiftLinesRight=Moves the indent of the current line, or of every line the selection covers, right or left by one indentSize.
showMessage=Displays the current compiler or XML parser error message.
shrinkWindowIfLargerThanBuffer=Reduces the size of a split window to the height of the buffer if the buffer is smaller than the current split window size.
sidebarListBuffers=Displays (and sets keyboard focus to) the sidebar buffer list.
sidebarListTags=Displays (and sets keyboard focus to) the sidebar tag list, if the current buffer supports tags.
slideIn=Moves all text in the marked region indentSize columns to the right.
slideOut=Moves all text in the marked region indentSize columns to the left.
sortLines=Sorts the lines in the selected region in ascending lexicographic order, based on the Unicode value of the characters in each line.
source=Finds the source of the Java class at the current location of the caret.
splitWindow=Splits the current window horizontally and moves focus to the new window.
stamp=Inserts the current date and time at the location of the caret.
startMacro=Records keystrokes for later playback.
svn=Executes an arbitrary Subversion command.
svnAdd=Runs the svn "add" command on the file associated with the current buffer.
svnChangeList=Runs the svn "changelist" command.
svnCommit=Opens a checkin buffer in which you can compose a svn checkin comment for the file associated with the current buffer.
svnDiff=Opens a diff output buffer showing the changes between your local copy of the file associated with the current buffer and the version in the Perforce repository.
svnDiffDir=Opens a diff output buffer showing the changes between the checked-in version and your local copy for all files that are modified in svn.
svnLog=Runs the svn "log" command on the file associated with the current buffer.
svnRevert=Runs the svn "revert" command on the file associated with the current buffer.
svnStatus=Opens a status output buffer showing the changes between the checked-in version and your local copy for all the files in the current directory and its subdirectories.
switchBuffer=Finds an open buffer, by matching what you type as findFileInProject does, and switches to it; Ctrl Enter shows it in the other window.
tab=If a multi-line region is selected, or if the property tabAlwaysIndent is true, this command simply calls indentLineOrRegion.
tempBufferQuit=Closes the current temporary output buffer and (if applicable) its window.
thisError=Jumps to the location in the source file that corresponds to the error message at the current location in the compilation buffer.
tillCharInLine=Moves the caret to the next (or previous) occurrence of a character on the current line.
tillCharInLineBackward=Moves the caret to the next (or previous) occurrence of a character on the current line.
toCenter=Moves the line containing the caret to the center of the window.
toTop=Moves the line containing the caret to the top of the window.
toggleCaseRegion=Swaps the case of every letter in the selected region, so that upper becomes lower and lower becomes upper.
toggleFold=Unfolds the fold just below the caret's line if there is one, else folds there.
toggleGroupByThread=Toggles the grouping of entries by thread in the current mailbox.
toggleSidebar=Toggles the sidebar.
toggleWrap=Toggles automatic word wrap in the current buffer.
top=Moves the caret to the top line of the display, keeping it in the same column.
uncommentRegion=Uncomments each line in the selected region, or the current line if no region is selected.
undo=Undoes the last editing action or actions.
unfold=Unfolds the current fold.
unfoldAll=Unfolds all the folds in the current buffer.
unfoldHere=Unfolds the fold just below the caret's line, and only that one; where unfold opens the next fold wherever it is.
unsplitAllWindows=Closes all windows except for the current edit window.
unsplitWindow=Closes the window(s) on the opposite side of the split from the current window.
unwrapParagraph=Removes line breaks from the current paragraph, making it into one lone line.
up=Moves the caret up one line.
upperCaseRegion=Converts all upper case characters in the selected region to lower case.
visibleTabs=Toggles the visibility of tab characters in the buffer.
vsplitWindow=Splits the current window vertically and moves focus to the new window.
whatChar=Displays decimal, hex and character equivalents for the character at the current location of the caret.
whereIs=Displays information about the keys mapped to a particular command.
windowDown=Moves the window down one line (so that the text seems to move up one line), without changing the location of the caret.
windowUp=Moves the window up one line (so that the text seems to move down one line), without changing the location of the caret.
wordLeft=Moves the caret to the beginning of the current word, or, if the caret is already at the beginning of the current word, to the beginning of the previous word.
wordRight=Moves the caret to the beginning of the next word.
wrapComment=Wraps all the lines in the current multi-line comment at the wrap column, which by default is column 80.
wrapParagraph=Wraps all the lines in the current paragraph at the wrap column, which by default is column 80.
wrapParagraphsInRegion=Calls wrapParagraph on all the paragraphs in the selected region (or on all the paragraphs in the buffer if no region is selected).
wrapRegion=Wraps all the lines in the selected region at the wrap column, which by default is column 80.
writeGlobalKeyMap=Prompts for a filename and writes out the current global key map to the specifed file, in human-readable form.
writeLocalKeyMap=Prompts for a filename and writes out the local key map for the current buffer to the specifed file, in human-readable form.
xmlElectricEquals=Inserts '=' at the current location of the caret.
xmlElectricSlash=Inserts '/' at the current location of the caret.
xmlFindCurrentNode=In XML mode, if XML parser support is available and the document tree is displayed in the sidebar, forces the tree to expand all the way down to the node corresponding to the location of the caret in the edit buffer.
xmlFindMatch=Finds the match to the XML tag at the location of the caret.
xmlInsertEmptyElementTag=Inserts an XML empty element tag.
xmlInsertMatchingEndTag=If there is an unmatched start tag before the current location of the caret, automatically inserts the corresponding end tag.
xmlInsertTag=Inserts an XML start tag and the corresponding end tag, enclosing the current selection.
xmlParseBuffer=In XML mode, parses the current buffer.
xmlValidateBuffer=In XML mode, validates the current buffer.
