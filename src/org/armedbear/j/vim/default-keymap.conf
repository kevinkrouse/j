# j's built-in modal (vim) key map.
#
# This table IS the key map: nothing is hard coded in Java. Copy it, edit it,
# and point the vimKeyMap preference at your copy to replace it wholesale, or
# override single bindings from ~/.config/j/vimrc.
#
# Columns, whitespace separated:
#
#   modes    which maps the binding belongs to, as in vim's map commands:
#            n normal, v visual, o operator-pending, i insert, c the / prompt
#   keys     the key sequence, in vim's notation. <character> stands for any
#            one key, which is how f{char} waits for the character to find.
#   kind     motion | operator | action | textobj | search | ex | keytokey |
#            command | idle
#   command  the name of the motion, action, operator or j command to run
#   args     comma separated; name=value, or a bare name meaning name=true.
#            "-" for none.
#
# Lines starting with # and blank lines are ignored.

# modes  keys            kind      command           args

# ------------------------------------------------------------------ motions

n,v,o    h               motion    moveByCharacters  forward=false
n,v,o    l               motion    moveByCharacters  forward=true
n,v,o    j               motion    moveByLines       forward=true,linewise,keepColumn
n,v,o    k               motion    moveByLines       forward=false,linewise,keepColumn

n,v,o    0               motion    moveToStartOfLine -
n,v,o    ^               motion    moveToFirstNonBlank -
n,v,o    $               motion    moveToEol         inclusive,stickyEol

n,v,o    gg              motion    moveToLine        forward=false,explicitRepeat,linewise,jump
n,v,o    G               motion    moveToLine        forward=true,explicitRepeat,linewise,jump
n,v,o    |               motion    moveToColumn      -

# ------------------------------------------------------------------ actions

n        i               action    enterInsertMode   at=here,isEdit
n        a               action    enterInsertMode   at=after,isEdit
n        I               action    enterInsertMode   at=firstNonBlank,isEdit
n        A               action    enterInsertMode   at=eol,isEdit
n        R               action    enterInsertMode   at=here,replace,isEdit
n        o               action    openLine          after=true,isEdit
n        O               action    openLine          after=false,isEdit

# ---------------------------------------------------------------- key to key

n,v,o    <Left>          keytokey  h
n,v,o    <Right>         keytokey  l
n,v,o    <Up>            keytokey  k
n,v,o    <Down>          keytokey  j
n,v,o    <Home>          keytokey  0
n,v,o    <End>           keytokey  $
n,v,o    <Space>         keytokey  l
n,v,o    <BS>            keytokey  h

# ------------------------------------------------------------------ windows

# CTRL-W and a key: j's windows, which are a tree of splits as vim's are. A
# split leaves the caret in the top or left window: vim puts the new window
# there and the caret in it, which looks the same. A lone CTRL-W waits for
# its key, and never reaches j's killBuffer binding.
n,v      <C-w>s          command   splitWindow       param=vim,once
n,v      <C-w>S          command   splitWindow       param=vim,once
n,v      <C-w><C-s>      command   splitWindow       param=vim,once
n,v      <C-w>v          command   vsplitWindow      param=vim,once
n,v      <C-w><C-v>      command   vsplitWindow      param=vim,once
n,v      <C-w>o          command   unsplitAllWindows once
n,v      <C-w><C-o>      command   unsplitAllWindows once
n,v      <C-w>=          command   balanceWindows    once
n,v      <C-w>c          action    closeWindow       -
n,v      <C-w>q          action    closeWindow       quit
n,v      <C-w><C-q>      action    closeWindow       quit

# To the next window or the one before; with a count, that window. p is the
# one used last.
n,v      <C-w>w          action    switchWindow      -
n,v      <C-w><C-w>      action    switchWindow      -
n,v      <C-w>W          action    switchWindow      backward
n,v      <C-w>p          command   priorWindow       once
n,v      <C-w><C-p>      command   priorWindow       once

# To the window left, below, above or right; of several, the one level with
# the caret. A count goes that many.
n,v      <C-w>h          command   adjacentWindow    param=h
n,v      <C-w>j          command   adjacentWindow    param=j
n,v      <C-w>k          command   adjacentWindow    param=k
n,v      <C-w>l          command   adjacentWindow    param=l
n,v      <C-w><C-h>      command   adjacentWindow    param=h
n,v      <C-w><C-j>      command   adjacentWindow    param=j
n,v      <C-w><C-k>      command   adjacentWindow    param=k
n,v      <C-w><C-l>      command   adjacentWindow    param=l
n,v      <C-w><Left>     command   adjacentWindow    param=h
n,v      <C-w><Down>     command   adjacentWindow    param=j
n,v      <C-w><Up>       command   adjacentWindow    param=k
n,v      <C-w><Right>    command   adjacentWindow    param=l

# ------------------------------------------------------------- word motions

n,v,o    w               motion    moveByWords       forward
n,v,o    W               motion    moveByWords       forward,bigWord
n,v,o    b               motion    moveByWords       forward=false
n,v,o    B               motion    moveByWords       forward=false,bigWord
n,v,o    e               motion    moveByWords       forward,wordEnd,inclusive
n,v,o    E               motion    moveByWords       forward,wordEnd,bigWord,inclusive
n,v,o    ge              motion    moveByWords       forward=false,wordEnd,inclusive
n,v,o    gE              motion    moveByWords       forward=false,wordEnd,bigWord,inclusive

# ------------------------------------------------------ find a character

n,v,o    f<character>    motion    moveToCharacter   forward,inclusive
n,v,o    F<character>    motion    moveToCharacter   forward=false
n,v,o    t<character>    motion    moveToCharacter   forward,till,inclusive
n,v,o    T<character>    motion    moveToCharacter   forward=false,till
n,v,o    ;               motion    repeatCharacterSearch -
n,v,o    ,               motion    repeatCharacterSearch reverse

# --------------------------------------------------------------- operators

n,o,v    d               operator  delete            -
n,o,v    c               operator  change            -

# The operators that are another operator with a motion already attached.
# Vim defines them exactly this way, so j does too rather than special casing
# them in Java.

n        x               keytokey  dl
n        X               keytokey  dh
n        D               keytokey  d$
n        C               keytokey  c$
n        s               keytokey  cl
n        S               keytokey  cc

# ------------------------------------ paragraph, section and sentence motions

n,v,o    }               motion    moveByParagraph   forward,jump
n,v,o    {               motion    moveByParagraph   forward=false,jump
# A section starts at a { in the first column, and its end is a }.
n,v,o    ]]              motion    moveBySection     forward,jump
n,v,o    [[              motion    moveBySection     forward=false,jump
n,v,o    ][              motion    moveBySection     forward,end,jump
n,v,o    []              motion    moveBySection     forward=false,end,jump
n,v,o    )               motion    moveBySentence    forward,jump
n,v,o    (               motion    moveBySentence    forward=false,jump

# --------------------------------------------------------- unmatched brackets

n,v,o    [(              motion    moveToUnmatched   bracket=(,jump
n,v,o    [{              motion    moveToUnmatched   bracket={,jump
n,v,o    ])              motion    moveToUnmatched   bracket=),jump
n,v,o    ]}              motion    moveToUnmatched   bracket=},jump

# ---------------------------------------------------------- yank and put

n,o,v    y               operator  yank              -
n        Y               keytokey  yy
n        p               action    put               after,isEdit
n        P               action    put               after=false,isEdit
n,v      "<character>    action    selectRegister    -

# -------------------------------------------------------------------- marks

n,v      m<character>    action    setMark           -
n,v,o    `<character>    motion    goToMark          jump
n,v,o    '<character>    motion    goToMark          linewise,jump
n,v,o    ]`              motion    jumpToMark        forward
n,v,o    [`              motion    jumpToMark        forward=false
n,v,o    ]'              motion    jumpToMark        forward,linewise
n,v,o    ['              motion    jumpToMark        forward=false,linewise
n        <C-o>           action    travelJumps       forward=false
n        <C-i>           action    travelJumps       forward
n        <Tab>           action    travelJumps       forward

# ------------------------------------------------------------- visual mode

n,v      v               action    toggleVisualMode  -
n,v      V               action    toggleVisualMode  linewise
n        gv              action    reselectVisual    -
v        o               action    swapVisualEnds    keepColumn
v        O               action    swapVisualEnds    keepColumn
v        gv              action    swapLastSelection -

# In visual mode an operator acts on the selection, so the shorthands are the
# operators themselves rather than operator-plus-motion.
v        x               keytokey  d
v        s               keytokey  c
# D C S R X Y are linewise even from a charwise selection. Not V then the
# operator: V in visual-line mode would leave visual mode.
v        D               operator  delete            linewise
v        X               operator  delete            linewise
v        Y               operator  yank              linewise
v        C               operator  change            linewise
v        S               operator  change            linewise
v        R               operator  change            linewise
v        u               keytokey  gu
v        U               keytokey  gU
v        ~               keytokey  g~
v        J               action    visualJoin        isEdit
v        gJ              action    visualJoin        keepSpaces,isEdit
v        r<character>    action    visualReplace     isEdit
v        p               action    visualPut         after,isEdit
v        P               action    visualPut         after=false,isEdit

# -------------------------------------------------------------- undo, redo

n        u               action    undo              -
n        <C-r>           action    redo              -

# ------------------------------------------------------- line and character

n        J               action    joinLines         isEdit
n        gJ              action    joinLines         keepSpaces,isEdit
n        r<character>    action    replaceCharacter  isEdit
n        ~               action    toggleCase        isEdit

# ------------------------------------------------------------- numbers

# Add the count to the number at or after the caret, or take it away. In
# visual mode, to the first number of each line; g adds a count more to each
# number after the first.
n,v      <C-a>           action    addToNumber       isEdit
n,v      <C-x>           action    addToNumber       subtract,isEdit
v        g<C-a>          action    addToNumber       progressive,isEdit
v        g<C-x>          action    addToNumber       subtract,progressive,isEdit

# --------------------------------------------------------- case and indent

n,o,v    gu              operator  changeCase        to=lower
n,o,v    gU              operator  changeCase        to=upper
n,o,v    g~              operator  changeCase        to=toggle
n,o,v    >               operator  indent            right
n,o,v    <               operator  indent            right=false

# ---------------------------------------------------------- screen motions

n,v,o    H               motion    moveToScreenLine  where=top,linewise,jump
n,v,o    M               motion    moveToScreenLine  where=middle,linewise,jump
n,v,o    L               motion    moveToScreenLine  where=bottom,linewise,jump
n,v,o    %               motion    moveToMatchingBracket inclusive,jump

# ------------------------------------------------------------------ repeat

n        .               action    repeatLastChange  -

# ------------------------------------------------------------ text objects
#
# Bound in operator-pending and visual only: iw means nothing on its own.

o,v      iw              textobj   word              inner
o,v      aw              textobj   word              -
o,v      iW              textobj   word              inner,bigWord
o,v      aW              textobj   word              bigWord

o,v      i"              textobj   quote             inner,quote="
o,v      a"              textobj   quote             quote="
o,v      i'              textobj   quote             inner,quote='
o,v      a'              textobj   quote             quote='
o,v      i`              textobj   quote             inner,quote=`
o,v      a`              textobj   quote             quote=`

o,v      i(              textobj   bracket           inner,open=(,close=)
o,v      a(              textobj   bracket           open=(,close=)
o,v      i)              textobj   bracket           inner,open=(,close=)
o,v      a)              textobj   bracket           open=(,close=)
o,v      ib              textobj   bracket           inner,open=(,close=)
o,v      ab              textobj   bracket           open=(,close=)
o,v      i[              textobj   bracket           inner,open=[,close=]
o,v      a[              textobj   bracket           open=[,close=]
o,v      i]              textobj   bracket           inner,open=[,close=]
o,v      a]              textobj   bracket           open=[,close=]
o,v      i{              textobj   bracket           inner,open={,close=}
o,v      a{              textobj   bracket           open={,close=}
o,v      i}              textobj   bracket           inner,open={,close=}
o,v      a}              textobj   bracket           open={,close=}
o,v      iB              textobj   bracket           inner,open={,close=}
o,v      aB              textobj   bracket           open={,close=}
o,v      i<              textobj   bracket           inner,open=<,close=>
o,v      a<              textobj   bracket           open=<,close=>
o,v      i>              textobj   bracket           inner,open=<,close=>
o,v      a>              textobj   bracket           open=<,close=>

o,v      ip              textobj   paragraph         inner
o,v      ap              textobj   paragraph         -

# ------------------------------------------------------------------ scroll

# j already had these two under its own names, and zb is the toBottom added
# to match. "command" runs one of j's named commands, so there is nothing
# modal here to implement.

n,v      zz              command   toCenter          -
n,v      zt              command   toTop             -
n,v      zb              command   toBottom          -

# Pages. j's pageDown and pageUp with the vim argument: two lines of overlap
# and the caret at the new top (or bottom), where plain pageDown keeps one
# line and the caret's row. A count pages that many times.
n,v      <C-f>           command   pageDown          param=vim
n,v      <C-b>           command   pageUp            param=vim

# --------------------------------------------------------------- buffers

# The alternate file: j's prevBuffer by most recent use rather than by list
# order. Ctrl-6 on most keyboards; <C-^> is how vim spells it.
n        <C-^>           command   prevBuffer        param=alternate,once
n        <C-6>           command   prevBuffer        param=alternate,once

# ------------------------------------------------------------ insert mode

# One shiftwidth more or less indent, rounded. j binds Ctrl-D to dir, which
# these rows keep out of the way while typing.
i        <C-t>           action    insertShift       right
i        <C-d>           action    insertShift       -

# Delete the word before the caret, or all of the line before it but its
# indent. Both stop once where typing began.
i        <C-w>           action    insertDeleteBack  word
i        <C-u>           action    insertDeleteBack  -

# A register's text, typed. '.' types the text again, so the row's own keys
# are not recorded. CTRL-R CTRL-R differs in vim only for control
# characters, which are always literal here.
i        <C-r><character> action   insertRegister    unrecorded
i        <C-r><C-r><character> action insertRegister unrecorded

# One normal-mode command, then back to insert.
i        <C-o>           action    insertOneCommand  unrecorded,keepColumn

# -------------------------------------------------------------- ex commands

# The rest of the line is read at a prompt, not by the trie, so this row only
# has to open it.

n,v      :               ex        exCommand         -

# @: runs the last ex line again. The rest of the @ family needs macros, so
# @a and friends match this row and do nothing, as vim does with an empty
# register.
n,v      @<character>    ex        repeatRegister    -

# ------------------------------------------------------------------ search
#
# / and ? ask for a pattern at the location bar, so they finish after the
# keystroke that started them. n N * # have their pattern already and are
# ordinary motions, which is what makes dn and d* work.

n,v,o    /               search    searchForward     forward
n,v,o    ?               search    searchBackward    forward=false

n,v,o    n               motion    repeatSearch      jump
n,v,o    N               motion    repeatSearch      reverse,jump

# While a / or ? pattern is typed, with incsearch: to the next match and the
# one before, whichever way the search goes. Enter then stops there.
c        <C-g>           action    incsearchStep     forward,keepColumn
c        <C-t>           action    incsearchStep     forward=false,keepColumn
n,v,o    *               motion    searchWordAtDot   forward,jump
n,v,o    #               motion    searchWordAtDot   forward=false,jump
n,v,o    g*              motion    searchWordAtDot   forward,partial,jump
n,v,o    g#              motion    searchWordAtDot   forward=false,partial,jump
